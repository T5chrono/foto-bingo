name: CI

on:
  push:
    branches: [master, develop]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test
      # Type-check mieszka w buildzie (tsc -b && vite build), tak jak w SplitDecu.
      - run: npm run build
